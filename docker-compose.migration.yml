# Local stand-in for the platform: the app image, its real datastore engine
# (Postgres 14 with TLS, like the hosted database) and MinIO standing in for S3.
# Secrets are read from the shell environment by name; nothing is stored here.
#   export COOKIE_SECRET=... ACCESS_CODE=... ADMIN_CODE=... POSTGRES_PASSWORD=... MINIO_ROOT_PASSWORD=...
#   docker compose -f docker-compose.migration.yml up -d --build
services:
  app:
    build: .
    image: realdreamteam:migration
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      AUCTION_DATABASE_URL: postgres://rdt@db:5432/rdt
      AUCTION_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
      ACCESS_CODE: ${ACCESS_CODE:?set ACCESS_CODE}
      ADMIN_CODE: ${ADMIN_CODE:?set ADMIN_CODE}
      SIM_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:14
    environment:
      POSTGRES_USER: rdt
      POSTGRES_DB: rdt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      - -c
      - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdt -d rdt"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: rdt-migration
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  db-data:
  minio-data:

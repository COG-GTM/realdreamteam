name: container-image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AUCTION_TEST_DATABASE_URL: postgres://postgres@localhost:5433/rdt_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Create test database
        run: |
          psql -h localhost -p 5433 -U postgres -c 'CREATE DATABASE rdt_test'
          psql -h localhost -p 5433 -U postgres -d rdt_test -v ON_ERROR_STOP=1 -q -f db/schema.sql
      - run: npm ci
      - name: Run tests
        run: |
          npm test 2>&1 | tee test-output.txt
          if grep -q '# SKIP' test-output.txt; then echo 'database tests were skipped'; exit 1; fi

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: realdreamteam
      INTERNAL_REGISTRY: ${{ secrets.INTERNAL_REGISTRY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Log in to internal registry
        if: github.event_name == 'push' && env.INTERNAL_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.INTERNAL_REGISTRY }}
          username: ${{ secrets.INTERNAL_REGISTRY_USERNAME }}
          password: ${{ secrets.INTERNAL_REGISTRY_PASSWORD }}
      - name: Push to internal registry
        if: github.event_name == 'push' && env.INTERNAL_REGISTRY != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.INTERNAL_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          push: true
          cache-from: type=gha
